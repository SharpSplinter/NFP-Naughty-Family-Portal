name: Deploy Cloudflare Worker

on:
  # Production migrations and Worker deployment are deliberately manual.
  # A merge to main must never be an implicit production cutover.
  workflow_dispatch:
    inputs:
      confirm_target:
        description: Confirm the production API Worker and D1 target
        required: true
        type: choice
        options:
          - naughtyfamily-api
      release_authorization:
        description: Explicitly authorize production D1 migrations and Worker deployment
        required: true
        type: choice
        options:
          - I approve production D1 migrations and Worker deployment
      candidate_commit:
        description: Exact release commit on main whose source tree is the production Worker candidate
        required: true
        type: string
      backup_reference:
        description: HTTPS reference to the encrypted external production D1 backup
        required: true
        type: string
      backup_sha256:
        description: Independently verified SHA-256 checksum of the encrypted backup
        required: true
        type: string
      backup_created_at:
        description: Backup creation time in ISO-8601 UTC; must be less than 24 hours old
        required: true
        type: string
      time_travel_bookmark_reference:
        description: HTTPS reference to the fresh pre-cutover D1 Time Travel bookmark
        required: true
        type: string
      d1_ledger_reference:
        description: HTTPS reference to the freshly verified production D1 migration ledger
        required: true
        type: string
      d1_usage_reference:
        description: HTTPS reference to fresh account-wide D1 rows-read usage evidence
        required: true
        type: string
      d1_usage_checked_at:
        description: Account-wide D1 usage check time in ISO-8601 UTC; must be less than 15 minutes old
        required: true
        type: string
      d1_rows_read:
        description: Current account-wide D1 rows read from the fresh usage check
        required: true
        type: string
      d1_hard_stop_rows:
        description: Account-wide daily D1 rows-read hard stop confirmed by the operator
        required: true
        type: string
      d1_release_reserve_rows:
        description: D1 read reserve kept available for the deployment window
        required: true
        default: "100000"
        type: string
      restore_rehearsal_run_url:
        description: Successful isolated production-data restore and migration-replay workflow run URL
        required: true
        type: string
      restore_rehearsal_commit:
        description: Exact commit SHA used by that successful restore rehearsal
        required: true
        type: string
      service_key_permission_reference:
        description: HTTPS reference to verified Torn service-key permission evidence
        required: true
        type: string
      queue_configuration_review_reference:
        description: HTTPS reference to the reviewed production Queue binding/configuration diff
        required: true
        type: string
      queue_configuration_ack:
        description: Explicitly authorize reconciliation of the Queue bindings declared in wrangler.toml
        required: true
        type: choice
        options:
          - I approve reconciliation of configured Queue bindings

permissions:
  actions: read
  contents: read
  deployments: write

concurrency:
  group: naughty-company-worker-deploy
  cancel-in-progress: false

jobs:
  deploy-worker:
    # GitHub Environment protection rules/reviewers must be configured for "production".
    # The evidence script runs before the first Cloudflare action.
    if: github.ref == 'refs/heads/main' && inputs.confirm_target == 'naughtyfamily-api'
    environment:
      name: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify production cutover evidence before any Cloudflare operation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          RELEASE_AUTHORIZATION: ${{ inputs.release_authorization }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          BACKUP_SHA256: ${{ inputs.backup_sha256 }}
          BACKUP_CREATED_AT: ${{ inputs.backup_created_at }}
          TIME_TRAVEL_BOOKMARK_REFERENCE: ${{ inputs.time_travel_bookmark_reference }}
          D1_LEDGER_REFERENCE: ${{ inputs.d1_ledger_reference }}
          D1_USAGE_REFERENCE: ${{ inputs.d1_usage_reference }}
          D1_USAGE_CHECKED_AT: ${{ inputs.d1_usage_checked_at }}
          D1_ROWS_READ: ${{ inputs.d1_rows_read }}
          D1_HARD_STOP_ROWS: ${{ inputs.d1_hard_stop_rows }}
          D1_RELEASE_RESERVE_ROWS: ${{ inputs.d1_release_reserve_rows }}
          RESTORE_REHEARSAL_RUN_URL: ${{ inputs.restore_rehearsal_run_url }}
          RESTORE_REHEARSAL_COMMIT: ${{ inputs.restore_rehearsal_commit }}
          SERVICE_KEY_PERMISSION_REFERENCE: ${{ inputs.service_key_permission_reference }}
          QUEUE_CONFIGURATION_REVIEW_REFERENCE: ${{ inputs.queue_configuration_review_reference }}
          QUEUE_CONFIGURATION_ACK: ${{ inputs.queue_configuration_ack }}
        run: node scripts/production-cutover-preflight.mjs

      - name: Run repository quality gates
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Review pending production D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.156.2"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: d1 migrations list naughty-company-dashboard --remote --config wrangler.toml

      - name: Apply pending production D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.156.2"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: d1 migrations apply naughty-company-dashboard --remote --config wrangler.toml

      - name: Verify applied production migration ledger
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.156.2"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: d1 migrations list naughty-company-dashboard --remote --config wrangler.toml

      - name: Deploy Worker to Cloudflare production
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.156.2"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: deploy --config wrangler.toml

      - name: Verify production Worker health and encryption readiness
        env:
          PRODUCTION_API_URL: https://naughtyfamily-api.kboone801.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.PRODUCTION_API_URL;
          const response = await fetch(`${base}/health`, { signal: AbortSignal.timeout(15000) });
          const body = await response.json().catch(() => null);
          console.log(`Production health -> ${response.status}; database=${body?.database}; keyEncryption=${body?.keyEncryption}`);
          if (!response.ok || body?.ok !== true || body?.database !== "ok" || body?.keyEncryption !== "ok") {
            throw new Error("Production Worker health or key-encryption readiness check failed.");
          }
          NODE
