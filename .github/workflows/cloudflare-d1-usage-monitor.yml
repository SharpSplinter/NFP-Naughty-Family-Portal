name: Monitor Cloudflare D1 Usage

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-d1-usage-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Read account D1 usage and write attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test D1 monitor calculations
        run: node scripts/test-cloudflare-d1-usage-monitor.mjs
      - name: Validate monitor script syntax
        run: node --check scripts/monitor-cloudflare-d1-usage.mjs
      - name: Poll Cloudflare D1 Insights (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/monitor-cloudflare-d1-usage.mjs
