name: Deploy Naughty Family acceptance staging

on:
  # Manual only. Pushes to portal-rebuild must never start a D1-backed staging run.
  workflow_dispatch:
    inputs:
      confirm_target:
        description: Confirm the isolated staging Pages project and API Worker
        required: true
        type: choice
        options:
          - naughtyfamily-staging
      feature_suite:
        description: Run one feature suite only. Historical event pages are never all replayed together.
        required: true
        type: choice
        options:
          - halloween
          - christmas-town
          - gym-training
          - discord
          - consent
          - company-dashboard
          - admin
permissions:
  contents: read

concurrency:
  group: naughty-family-real-key-acceptance-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/portal-rebuild' && github.event_name == 'workflow_dispatch' && inputs.confirm_target == 'naughtyfamily-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the reviewed PR branch
        uses: actions/checkout@v7
        with:
          ref: portal-rebuild

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository quality gates
        run: |
          npm run typecheck
          npm test
          npm run build
          node --check scripts/seed-staging-private-history.mjs
          node --check scripts/cleanup-staging-private-history.mjs
          node --check scripts/test-staging-responsive.mjs
          node --check scripts/test-staging-features.mjs
          node --check scripts/test-staging-admin-acceptance.mjs
          node --check scripts/staging-d1-read-budget.mjs
          node --check scripts/test-staging-safety-contract.mjs

      - name: Verify every deployment target is isolated staging
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'name = "naughtyfamily-api-staging"' wrangler.acceptance.toml
          grep -F 'database_name = "naughtyfamily-acceptance-staging"' wrangler.acceptance.toml
          grep -F 'database_id = "02cca699-1232-495f-8a0a-de525058b92a"' wrangler.acceptance.toml
          grep -F 'ALLOWED_ORIGIN = "https://naughtyfamily-staging.pages.dev"' wrangler.acceptance.toml
          grep -F 'binding = "NCD_DAILY_READ_CACHE"' wrangler.acceptance.toml
          grep -F 'id = "fa61636ea2cf4a39b00e255024d0fc7d"' wrangler.acceptance.toml
          ! grep -F 'id = "9587689089c04f37b28eb9c93156cc47"' wrangler.acceptance.toml
          ! grep -F 'bbbe128a-c5cc-46ec-b8ef-93860183e795' wrangler.acceptance.toml
          grep -F 'binding = "GLOBAL_RANKINGS_QUEUE"' wrangler.acceptance.toml
          grep -F 'queue = "ncd-naughtyfamily-staging-collection"' wrangler.acceptance.toml
          grep -F 'dead_letter_queue = "ncd-naughtyfamily-staging-dlq"' wrangler.acceptance.toml
          ! grep -F 'ncd-global-rankings-refresh' wrangler.acceptance.toml
          ! grep -F 'ncd-faction-performance-integration' wrangler.acceptance.toml
          grep -F 'database_id = "1e37f1a5-daa3-41fb-8c1b-7a9c6e3d0405"' wrangler.staging.toml
          ! grep -F '[triggers]' wrangler.acceptance.toml
          echo "Confirmed: acceptance Worker uses isolated staging D1 and staging-only Queues; cron triggers are omitted to respect the account Free-plan quota, and production targets are excluded."

      - name: Start hard account-wide D1 rows-read budget
        id: d1_budget_start
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c03b978ed9a59adc3f61c715bdad45c
          D1_BUDGET_STATE_FILE: ${{ runner.temp }}/ncd-d1-read-budget.json
          D1_RUN_BUDGET_ROWS: "100000"
          D1_DAILY_STOP_ROWS: "4000000"
        run: node scripts/staging-d1-read-budget.mjs start

      - name: Provision isolated staging Queues
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c03b978ed9a59adc3f61c715bdad45c
        run: node scripts/ensure-naughtyfamily-staging-queues.mjs

      - name: Apply pending migrations to staging D1 only
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.156.2"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: d1 migrations apply naughtyfamily-acceptance-staging --remote --config wrangler.acceptance.toml

      - name: Verify staging migration ledger
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.156.2"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: d1 migrations list naughtyfamily-acceptance-staging --remote --config wrangler.acceptance.toml

      - name: Deploy isolated staging API Worker
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.156.2"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: deploy --config wrangler.acceptance.toml

      - name: Verify staging API health, encryption readiness, and browser CORS
        env:
          STAGING_API_URL: https://naughtyfamily-api-staging.kboone801.workers.dev
          STAGING_PAGES_ORIGIN: https://naughtyfamily-staging.pages.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.STAGING_API_URL;
          const origin = process.env.STAGING_PAGES_ORIGIN;
          let health = null;
          for (let attempt = 1; attempt <= 8; attempt++) {
            const response = await fetch(`${base}/health`, {
              headers: { accept: "application/json", origin },
              signal: AbortSignal.timeout(10000),
            }).catch(() => null);
            if (response?.ok) {
              health = { response, body: await response.json().catch(() => null) };
              break;
            }
            if (attempt < 8) await new Promise(resolve => setTimeout(resolve, 3000));
          }
          if (!health) throw new Error("Staging Worker health endpoint did not become ready.");
          const allowOrigin = health.response.headers.get("access-control-allow-origin");
          console.log(`STAGING /health -> ${health.response.status}; database=${health.body?.database}; keyEncryption=${health.body?.keyEncryption}; cors=${allowOrigin === origin}`);
          if (health.body?.ok !== true || health.body?.database !== "ok" || health.body?.keyEncryption !== "ok" || allowOrigin !== origin) {
            throw new Error("Staging is not safe for member credentials. Verify staging D1, CORS and a unique KEY_ENCRYPTION_SECRET on naughtyfamily-api-staging.");
          }
          const preflight = await fetch(`${base}/api/auth/session`, {
            method: "OPTIONS",
            headers: { origin, "access-control-request-method": "GET", "access-control-request-headers": "authorization" },
          });
          const preflightOrigin = preflight.headers.get("access-control-allow-origin");
          console.log(`STAGING CORS preflight -> ${preflight.status}; originAllowed=${preflightOrigin === origin}`);
          if (preflight.status !== 204 || preflightOrigin !== origin) throw new Error("Staging browser CORS preflight failed.");
          NODE

      - name: Build Pages bundle for staging API
        env:
          VITE_API_BASE_URL: https://naughtyfamily-api-staging.kboone801.workers.dev
        run: npm run build

      - name: Deploy to the isolated naughtyfamily-staging Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.156.2"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: pages deploy dist --project-name naughtyfamily-staging --branch main

      - name: Verify the staging Pages origin
        env:
          STAGING_PAGES_URL: https://naughtyfamily-staging.pages.dev
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.STAGING_PAGES_URL;
          const expectedApiBase = "naughtyfamily-api-staging.kboone801.workers.dev";
          let verified = null;
          let lastObservation = null;

          // Pages deployment aliases can take a short time to serve the newest
          // HTML after the upload reports success. Re-fetch the HTML without
          // relying on the edge cache, then verify the referenced content-hash
          // asset actually contains the isolated staging Worker URL.
          for (let attempt = 1; attempt <= 12; attempt++) {
            const checkUrl = new URL(url);
            checkUrl.searchParams.set("__staging_deploy_check", `${Date.now()}-${attempt}`);
            const response = await fetch(checkUrl, {
              cache: "no-store",
              signal: AbortSignal.timeout(15000),
            }).catch(() => null);
            const html = response ? await response.text() : "";
            const assetPaths = [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/g)]
              .map(match => match[1])
              .filter(assetPath => assetPath.includes(".js"));

            if (response?.ok && html.includes('id="root"') && assetPaths.length > 0) {
              const assets = await Promise.all(assetPaths.map(async assetPath => {
                const assetUrl = new URL(assetPath, url);
                assetUrl.searchParams.set("__staging_deploy_check", String(attempt));
                const assetResponse = await fetch(assetUrl, {
                  cache: "no-store",
                  signal: AbortSignal.timeout(15000),
                });
                if (!assetResponse.ok) {
                  throw new Error(`Staging asset failed: ${assetResponse.status} ${assetPath}`);
                }
                return await assetResponse.text();
              }));
              const correctApiBase = assets.some(asset => asset.includes(expectedApiBase));
              lastObservation = {
                status: response.status,
                rootMount: true,
                assetPaths,
                correctApiBase,
              };
              if (correctApiBase) {
                verified = lastObservation;
                break;
              }
            } else {
              lastObservation = {
                status: response?.status ?? "unreachable",
                rootMount: html.includes('id="root"'),
                assetPaths,
                correctApiBase: false,
              };
            }

            console.log(`Waiting for Pages alias propagation (${attempt}/12): ${JSON.stringify(lastObservation)}`);
            if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 2500));
          }

          if (!verified) {
            throw new Error(`Staging Pages did not expose the new bundle with ${expectedApiBase}. Last observation: ${JSON.stringify(lastObservation)}`);
          }
          console.log(`STAGING PAGES -> ${verified.status}; rootMount=true; jsAssets=${verified.assetPaths.length}; correctApiBaseInBundle=true`);
          NODE

      - name: Install Playwright Chromium for staging viewport checks
        run: |
          npm install --no-save --package-lock=false playwright @axe-core/playwright
          npx playwright install --with-deps chromium

      - name: Seed isolated authenticated private-history fixtures
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c03b978ed9a59adc3f61c715bdad45c
        run: node scripts/seed-staging-private-history.mjs

      - name: Check D1 read budget after fixture seeding
        if: always() && steps.d1_budget_start.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c03b978ed9a59adc3f61c715bdad45c
          D1_BUDGET_STATE_FILE: ${{ runner.temp }}/ncd-d1-read-budget.json
          D1_RUN_BUDGET_ROWS: "100000"
          D1_DAILY_STOP_ROWS: "4000000"
        run: node scripts/staging-d1-read-budget.mjs check

      - name: Run exactly one selected feature suite
        env:
          STAGING_PAGES_URL: https://naughtyfamily-staging.pages.dev
          STAGING_API_URL: https://naughtyfamily-api-staging.kboone801.workers.dev
          STAGING_FEATURE_SUITE: ${{ inputs.feature_suite }}
        run: |
          case "${STAGING_FEATURE_SUITE}" in
            halloween|christmas-town|gym-training|discord|consent) node scripts/test-staging-features.mjs ;;
            company-dashboard) node scripts/test-staging-responsive.mjs ;;
            admin) node scripts/refresh-staging-load-fixture.mjs && node scripts/test-staging-admin-acceptance.mjs ;;
            *) echo "Unsupported selective staging feature: ${STAGING_FEATURE_SUITE}" >&2; exit 2 ;;
          esac

      - name: Enforce D1 rows-read budget after selected feature
        if: always() && steps.d1_budget_start.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c03b978ed9a59adc3f61c715bdad45c
          D1_BUDGET_STATE_FILE: ${{ runner.temp }}/ncd-d1-read-budget.json
          D1_RUN_BUDGET_ROWS: "100000"
          D1_DAILY_STOP_ROWS: "4000000"
        run: node scripts/staging-d1-read-budget.mjs check

      - name: Remove synthetic private-history fixtures from staging D1
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c03b978ed9a59adc3f61c715bdad45c
        run: node scripts/cleanup-staging-private-history.mjs

      - name: Final D1 rows-read budget check after cleanup
        if: always() && steps.d1_budget_start.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6c03b978ed9a59adc3f61c715bdad45c
          D1_BUDGET_STATE_FILE: ${{ runner.temp }}/ncd-d1-read-budget.json
          D1_RUN_BUDGET_ROWS: "100000"
          D1_DAILY_STOP_ROWS: "4000000"
        run: node scripts/staging-d1-read-budget.mjs check

      - name: Upload staging viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-dashboard-staging-validation
          path: test-results/
          if-no-files-found: ignore
