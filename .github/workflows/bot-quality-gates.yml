name: Discord Bot Quality Gates

on:
  pull_request:
    branches: [main]
    paths:
      - "bot/**"
      - ".github/workflows/bot-quality-gates.yml"
      - ".github/workflows/production-bot-deploy.yml"

permissions:
  contents: read

concurrency:
  group: discord-bot-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate retained Worker and command modules
        run: |
          for file in \
            bot/production-worker.js \
            bot/daily-summary.mjs \
            bot/command-schema.mjs \
            bot/command-schema-contract.mjs \
            bot/register-commands.mjs \
            bot/configure-production-endpoint.mjs \
            bot/production-health.mjs \
            bot/check-production-health.mjs \
            bot/commands/link.mjs \
            bot/commands/link-code.mjs \
            bot/commands/status.mjs \
            bot/commands/unlink.mjs; do
            node --check "$file"
          done
      - name: Validate retained test modules
        run: |
          for file in \
            bot/test-bot-contract.mjs \
            bot/test-daily-summary.mjs \
            bot/test-register-commands.mjs \
            bot/test-production-health.mjs \
            bot/test-production-deploy-trigger.mjs; do
            node --check "$file"
          done
      - name: Test summary-only Worker contract and DM interaction handling
        run: node bot/test-bot-contract.mjs
      - name: Test daily summary calculation, scheduling, and private delivery
        run: node bot/test-daily-summary.mjs
      - name: Test global USER_INSTALL and BOT_DM command registration
        run: node bot/test-register-commands.mjs
      - name: Test production Worker health contract
        run: node bot/test-production-health.mjs
      - name: Validate production deployment trigger guard
        run: node bot/test-production-deploy-trigger.mjs
      - name: Validate production-only target and schema files
        run: |
          grep -Fq 'name = "naughty-company-bot"' bot/wrangler.production.toml
          ! grep -qi 'staging' bot/wrangler.production.toml
          grep -Fq 'crons = ["20 * * * *"]' bot/wrangler.production.toml
          grep -Fq 'binding = "BOT_DB"' bot/wrangler.production.toml
          grep -Fq 'database_name = "naughty-company-bot-production"' bot/wrangler.production.toml
          grep -Fq 'binding = "DASHBOARD_API"' bot/wrangler.production.toml
          grep -Fq 'DISCORD_PUBLIC_KEY = "' bot/wrangler.production.toml
          test -f bot/migrations/0001_bot_schema.sql
          test -f bot/migrations/0002_daily_company_summary_history.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS discord_links' bot/migrations/0001_bot_schema.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS discord_daily_summary_deliveries' bot/migrations/0001_bot_schema.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS discord_daily_company_summary_state' bot/migrations/0001_bot_schema.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS discord_daily_company_summary_history' bot/migrations/0002_daily_company_summary_history.sql
          grep -Fq 'naughty-company-bot.kboone801.workers.dev' bot/configure-production-endpoint.mjs
          grep -Fq '/health' bot/check-production-health.mjs
