name: Cleanup retired Discord D1 tables

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: Confirm both production D1 cleanup targets
        required: true
        type: choice
        options:
          - naughtyfamily-api-and-naughty-company-bot-production-d1
      release_authorization:
        description: Explicitly authorize removal of retired Discord tables
        required: true
        type: choice
        options:
          - I approve removal of retired Discord telemetry and alert tables after production Worker verification
      candidate_commit:
        description: Exact cleanup commit on main
        required: true
        type: string
      expected_api_version:
        description: Exact production API Worker version to verify before cleanup
        required: true
        type: string
      expected_bot_version:
        description: Exact production private daily-summary bot Worker version to verify before cleanup
        required: true
        type: string
      dashboard_backup_evidence:
        description: JSON object with reference, sha256, and created_at for the encrypted dashboard backup
        required: true
        type: string
      bot_backup_evidence:
        description: JSON object with reference and created_at for the private bot D1 export
        required: true
        type: string
      d1_release_evidence:
        description: JSON object with bookmark_reference, usage_reference, usage_checked_at, rows_read, hard_stop_rows, and release_reserve_rows
        required: true
        type: string
      restore_rehearsal_run_url:
        description: Exact-candidate successful local SQLite restore rehearsal
        required: true
        type: string
      restore_rehearsal_commit:
        description: Commit SHA used by the successful restore rehearsal
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: naughty-company-retired-discord-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main' && inputs.confirm_target == 'naughtyfamily-api-and-naughty-company-bot-production-d1'
    environment:
      name: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact cleanup candidate
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository and cleanup regression tests
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Verify live Worker, backups, restore rehearsal and fresh D1 reserve before changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          RELEASE_AUTHORIZATION: ${{ inputs.release_authorization }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          EXPECTED_API_VERSION: ${{ inputs.expected_api_version }}
          EXPECTED_BOT_VERSION: ${{ inputs.expected_bot_version }}
          DASHBOARD_BACKUP_EVIDENCE: ${{ inputs.dashboard_backup_evidence }}
          BOT_BACKUP_EVIDENCE: ${{ inputs.bot_backup_evidence }}
          D1_RELEASE_EVIDENCE: ${{ inputs.d1_release_evidence }}
          RESTORE_REHEARSAL_RUN_URL: ${{ inputs.restore_rehearsal_run_url }}
          RESTORE_REHEARSAL_COMMIT: ${{ inputs.restore_rehearsal_commit }}
        run: node scripts/legacy-discord-cleanup-preflight.mjs

      - name: Remove retired Discord poll telemetry from dashboard D1
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.156.2"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: d1 migrations apply naughty-company-dashboard --remote --config wrangler.toml

      - name: Remove retired alert and poll state from bot D1
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.156.2"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: d1 execute naughty-company-bot-production --remote --file bot/migrations/0003_retire_legacy_alert_tables.sql --config bot/wrangler.production.toml

      - name: Verify both production D1 schemas and Worker health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/verify-legacy-discord-cleanup.mjs
