name: Deploy Discord Bot to Production

on:
  # Production bot deployment is deliberately manual.
  # Portal API and Pages must be live before the bot switches member-facing links.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naughty-company-bot-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate retained Worker and command modules
        run: |
          for file in \
            bot/production-worker.js \
            bot/daily-summary.mjs \
            bot/command-schema.mjs \
            bot/command-schema-contract.mjs \
            bot/register-commands.mjs \
            bot/configure-production-endpoint.mjs \
            bot/production-health.mjs \
            bot/check-production-health.mjs \
            bot/commands/link.mjs \
            bot/commands/link-code.mjs \
            bot/commands/status.mjs \
            bot/commands/unlink.mjs; do
            node --check "$file"
          done
      - name: Validate retained bot test modules
        run: |
          for file in \
            bot/test-bot-contract.mjs \
            bot/test-daily-summary.mjs \
            bot/test-register-commands.mjs \
            bot/test-production-health.mjs \
            bot/test-production-deploy-trigger.mjs; do
            node --check "$file"
          done
      - name: Test summary-only Worker contract
        run: node bot/test-bot-contract.mjs
      - name: Test daily summary calculation, scheduling, and delivery behavior
        run: node bot/test-daily-summary.mjs
      - name: Test global USER_INSTALL and BOT_DM command registration
        run: node bot/test-register-commands.mjs
      - name: Test production Worker health contract
        run: node bot/test-production-health.mjs
      - name: Verify Discord User Install is enabled (read-only)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: node bot/configure-production-endpoint.mjs --check-install
      - name: Ensure production deployment is manual-only and main-only
        run: node bot/test-production-deploy-trigger.mjs
      - name: Validate production-only Worker and database targets
        run: |
          grep -Fq 'name = "naughty-company-bot"' bot/wrangler.production.toml
          ! grep -qi 'staging' bot/wrangler.production.toml
          grep -Fq 'crons = ["20 * * * *"]' bot/wrangler.production.toml
          grep -Fq 'binding = "BOT_DB"' bot/wrangler.production.toml
          grep -Fq 'database_name = "naughty-company-bot-production"' bot/wrangler.production.toml
          grep -Fq 'binding = "DASHBOARD_API"' bot/wrangler.production.toml
          grep -Fq 'DISCORD_PUBLIC_KEY = "' bot/wrangler.production.toml
          test -f bot/migrations/0001_bot_schema.sql
          test -f bot/migrations/0002_daily_company_summary_history.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS discord_links' bot/migrations/0001_bot_schema.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS discord_daily_summary_deliveries' bot/migrations/0001_bot_schema.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS discord_daily_company_summary_state' bot/migrations/0001_bot_schema.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS discord_daily_company_summary_history' bot/migrations/0002_daily_company_summary_history.sql
          grep -Fq 'naughty-company-bot.kboone801.workers.dev' bot/configure-production-endpoint.mjs
          grep -Fq '/health' bot/check-production-health.mjs
  deploy-production:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require production deployment and Discord registration credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$DISCORD_TOKEN" || { echo "::error::Missing DISCORD_TOKEN repository Actions secret. Cloudflare Worker secrets are not shared with Actions."; exit 1; }
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate Discord token before production deployment
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: node bot/register-commands.mjs --check-token
      - name: Require Discord User Install to be enabled
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: node bot/configure-production-endpoint.mjs --check-install
      - name: Initialize production bot database schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.156.2 d1 execute naughty-company-bot-production --remote --file bot/migrations/0001_bot_schema.sql --config bot/wrangler.production.toml
      - name: Initialize daily company summary comparison history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.156.2 d1 execute naughty-company-bot-production --remote --file bot/migrations/0002_daily_company_summary_history.sql --config bot/wrangler.production.toml
      - name: Deploy only the production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.156.2"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6c03b978ed9a59adc3f61c715bdad45c
          command: deploy --config bot/wrangler.production.toml
      - name: Set Discord interactions endpoint to production
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: node bot/configure-production-endpoint.mjs
      - name: Register global user-installed DM slash commands
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: node bot/register-commands.mjs
      - name: Verify production Worker health endpoint
        env:
          DISCORD_INTERACTIONS_ENDPOINT: https://naughty-company-bot.kboone801.workers.dev
        run: node bot/check-production-health.mjs
