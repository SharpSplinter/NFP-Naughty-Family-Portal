name: Probe legacy Christmas Town v1 log arrays

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-legacy-logs:
    name: Probe each legacy log selection for every event year
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TORN_API_KEY_SERVICE: ${{ secrets.TORN_API_KEY_SERVICE }}
    steps:
      - name: Verify service key is available
        shell: bash
        run: |
          if [[ -z "${TORN_API_KEY_SERVICE:-}" ]]; then
            echo "::error::TORN_API_KEY_SERVICE is unavailable to this workflow. The secret value was not read or printed."
            exit 1
          fi
          echo "TORN_API_KEY_SERVICE is configured; its value is withheld."

      - name: Inspect key permissions using Torn API v2 key info
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const key = process.env.TORN_API_KEY_SERVICE;
          const response = await fetch("https://api.torn.com/v2/key/info", {
            method: "GET",
            headers: { authorization: "ApiKey " + key, accept: "application/json" },
            signal: AbortSignal.timeout(20000)
          });
          const payload = await response.json().catch(() => null);
          const error = payload?.error && typeof payload.error === "object"
            ? { code: payload.error.code ?? null, message: payload.error.error ?? null }
            : null;
          const info = payload?.info ?? {};
          const access = info.access ?? {};
          const customLog = access.log ?? {};
          const available = Array.isArray(customLog.available) ? customLog.available : [];
          const requestedIds = [8932, 8937, 8933];
          const allowed = id => customLog.custom_permissions === true
            ? available.some(group => Array.isArray(group.log_ids) && group.log_ids.map(Number).includes(id))
            : customLog.custom_permissions === false ? true : null;
          const levelNames = { 1: "Public Only", 2: "Minimal Access", 3: "Limited Access", 4: "Full Access" };
          const report = {
            apiVersion: "v2",
            endpoint: "/key/info",
            httpStatus: response.status,
            httpOk: response.ok,
            apiError: error,
            accessType: access.type ?? null,
            accessLevel: levelNames[Number(access.level)] ?? access.level ?? null,
            userLogSelectionEnabled: Array.isArray(info.selections?.user)
              ? info.selections.user.includes("log")
              : null,
            customLogPermissions: typeof customLog.custom_permissions === "boolean"
              ? customLog.custom_permissions
              : null,
            legacyPermissions: access.legacy_permissions ?? null,
            targetLogIds: requestedIds.map(id => ({ id, allowedByKeyInfo: allowed(id) }))
          };
          console.log("TORN_KEY_INFO " + JSON.stringify(report));
          if (!response.ok || error || !payload?.info) process.exitCode = 1;
          NODE

      - name: Query each legacy v1 log ID across every Christmas Town event year
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const selections = [
            { id: 8932, label: "Christmas town chest open (legacy)" },
            { id: 8937, label: "Christmas town ornament (deprecated)" },
            { id: 8933, label: "Christmas town reward (legacy)" },
          ];
          const years = Array.from({ length: 9 }, (_, index) => 2017 + index);
          const key = process.env.TORN_API_KEY_SERVICE;

          if (!key) {
            console.error("Missing TORN_API_KEY_SERVICE.");
            process.exit(1);
          }

          const isRecord = value =>
            value !== null && typeof value === "object" && !Array.isArray(value);

          function describeShape(value, depth = 0) {
            if (Array.isArray(value)) {
              return {
                type: "array",
                length: value.length,
                firstItem: value.length && depth < 4
                  ? describeShape(value[0], depth + 1)
                  : undefined
              };
            }
            if (isRecord(value)) {
              return {
                type: "object",
                fields: Object.entries(value).slice(0, 60).map(([name, child]) => ({
                  name,
                  ...describeShape(child, depth + 1)
                }))
              };
            }
            return { type: value === null ? "null" : typeof value };
          }

          function countRecords(collection) {
            if (Array.isArray(collection)) return collection.length;
            if (isRecord(collection)) return Object.keys(collection).length;
            return null;
          }

          const results = [];
          let failed = false;
          for (const year of years) {
            const from = Math.floor(Date.UTC(year, 11, 1, 0, 0, 0) / 1000);
            const to = Math.floor(Date.UTC(year + 1, 0, 16, 0, 0, 0) / 1000) - 1;

            for (const selection of selections) {
              const url = new URL("https://api.torn.com/user/");
              url.searchParams.set("selections", "log");
              url.searchParams.set("log", String(selection.id));
              url.searchParams.set("from", String(from));
              url.searchParams.set("to", String(to));
              url.searchParams.set("key", key);

              let report;
              try {
                const response = await fetch(url, {
                  method: "GET",
                  headers: { accept: "application/json" },
                  signal: AbortSignal.timeout(20000)
                });
                const body = await response.text();
                let payload = null;
                let parseError = null;
                try {
                  payload = JSON.parse(body);
                } catch {
                  parseError = "Response body was not valid JSON.";
                }

                const apiError = isRecord(payload?.error)
                  ? { code: payload.error.code ?? null, message: payload.error.error ?? null }
                  : null;
                const collectionKey = isRecord(payload) && Object.hasOwn(payload, "log")
                  ? "log"
                  : isRecord(payload) && Object.hasOwn(payload, "logs")
                    ? "logs"
                    : null;
                const collection = collectionKey ? payload[collectionKey] : null;
                const count = countRecords(collection);
                const firstRecord = Array.isArray(collection)
                  ? collection[0]
                  : isRecord(collection) ? Object.values(collection)[0] : undefined;

                report = {
                  eventYear: year,
                  windowStartUtc: new Date(from * 1000).toISOString(),
                  windowEndUtc: new Date(to * 1000).toISOString(),
                  selectionId: selection.id,
                  selection: selection.label,
                  apiVersion: "v1",
                  httpStatus: response.status,
                  httpOk: response.ok,
                  apiError,
                  parseError,
                  topLevelFields: isRecord(payload) ? Object.keys(payload) : [],
                  logCollectionField: collectionKey,
                  collectionType: collection === null
                    ? "missing-or-null"
                    : Array.isArray(collection) ? "array" : typeof collection,
                  recordCount: count,
                  firstRecordSchema: firstRecord === undefined
                    ? null
                    : describeShape(firstRecord)
                };
                if (!response.ok || apiError || parseError || count === null) failed = true;
              } catch (error) {
                failed = true;
                report = {
                  eventYear: year,
                  selectionId: selection.id,
                  selection: selection.label,
                  apiVersion: "v1",
                  requestError: error instanceof Error
                    ? error.name + ": " + error.message
                    : "Unknown request error"
                };
              }

              results.push(report);
              console.log("TORN_V1_HISTORICAL_PROBE " + JSON.stringify(report));
              await new Promise(resolve => setTimeout(resolve, 1200));
            }
          }

          const totals = selections.map(selection => {
            const entries = results.filter(result => result.selectionId === selection.id);
            return {
              selectionId: selection.id,
              selection: selection.label,
              totalRecordsAcrossYears: entries.reduce(
                (sum, entry) => sum + (Number.isFinite(entry.recordCount) ? entry.recordCount : 0), 0
              ),
              yearsWithRecords: entries
                .filter(entry => Number.isFinite(entry.recordCount) && entry.recordCount > 0)
                .map(entry => entry.eventYear),
              yearCounts: entries.map(entry => ({
                year: entry.eventYear,
                count: entry.recordCount
              }))
            };
          });

          console.log("TORN_V1_HISTORICAL_SUMMARY " + JSON.stringify({
            yearsTested: years,
            eventWindow: "December 1 through January 15 (inclusive)",
            requestCount: results.length,
            totals
          }));

          if (failed) process.exitCode = 1;
          NODE
