name: Temporary D1 Invocation Write Accounting Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d1-invocation-accounting:
    name: Reconcile D1 writes to Worker invocation logs for Nov 23 UTC
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover Observability field values and query D1 accounting logs in dry-run mode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const ACCOUNT_ID = "6c03b978ed9a59adc3f61c715bdad45c";
          const START = "2026-11-23T00:00:00Z";
          const END = "2026-11-24T00:00:00Z";
          const timeframe = { from: Date.parse(START), to: Date.parse(END) };
          const API = `https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/observability/telemetry`;

          if (!token) throw new Error("CLOUDFLARE_API_TOKEN Actions secret is missing or unavailable.");

          async function cloudflareGet(path, label) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              method: "GET",
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: "application/json",
              },
              signal: AbortSignal.timeout(20000),
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) {
              const messages = (payload?.errors ?? []).map((x) => String(x.message ?? "API error")).join("; ");
              throw new Error(`${label} failed (HTTP ${response.status}): ${messages || "invalid response"}`);
            }
            return payload.result;
          }

          async function cloudflarePost(path, body, label) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(25000),
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) {
              const messages = (payload?.errors ?? []).map((x) => String(x.message ?? "API error")).join("; ");
              throw new Error(`${label} failed (HTTP ${response.status}): ${messages || "invalid response"}`);
            }
            return payload.result;
          }

          async function post(path, body, label) {
            const response = await fetch(`${API}${path}`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(25000),
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) {
              const messages = (payload?.errors ?? []).map((x) => String(x.message ?? "API error")).join("; ");
              throw new Error(`${label} failed (HTTP ${response.status}): ${messages || "invalid response"}`);
            }
            return payload.result;
          }

          function getValues(result) {
            if (Array.isArray(result?.values)) return result.values;
            if (Array.isArray(result)) return result;
            return [];
          }

          function valueText(item) {
            if (item && typeof item === "object" && "value" in item) return String(item.value);
            return String(item ?? "");
          }

          function parseLog(value, depth = 0) {
            if (depth > 8 || value == null) return [];
            if (typeof value === "string") {
              const text = value.trim();
              if (!text.includes("d1_read_accounting")) return [];
              try { return parseLog(JSON.parse(text), depth + 1); } catch { return []; }
            }
            if (Array.isArray(value)) return value.flatMap((x) => parseLog(x, depth + 1));
            if (typeof value !== "object") return [];
            if (value.event === "d1_read_accounting") return [value];
            const out = [];
            for (const child of Object.values(value)) out.push(...parseLog(child, depth + 1));
            return out;
          }

          function num(value) {
            const n = Number(value ?? 0);
            return Number.isFinite(n) ? n : 0;
          }

          try {
            const DB_ID = "bbbe128a-c5cc-46ec-b8ef-93860183e795";
            const targetTables = [
              "automation_runs",
              "company_api_keys",
              "companies",
              "company_snapshots",
              "company_financials",
              "company_financial_snapshots",
              "faction_member_cache",
              "faction_director_snapshots",
              "faction_membership_intervals",
              "faction_performance_collection_runs",
              "faction_performance_collection_state",
              "faction_roster_snapshots",
              "faction_member_roster_snapshots",
              "faction_member_stat_snapshots",
              "faction_gym_energy_snapshots",
              "global_rankings_refresh_runs",
              "global_rankings_refresh_pages",
              "faction_company_rank_snapshots",
            ];
            const schemaSql = `SELECT name, sql FROM sqlite_master WHERE type = 'table' AND name IN (${targetTables.map((name) => "'" + name.replace(/'/g, "''") + "'").join(",")}) ORDER BY name`;
            const schemaResponse = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/d1/database/${DB_ID}/query`,
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Content-Type": "application/json",
                  Accept: "application/json",
                },
                body: JSON.stringify({ sql: schemaSql }),
                signal: AbortSignal.timeout(20000),
              }
            );
            const schemaPayload = await schemaResponse.json().catch(() => null);
            if (!schemaResponse.ok || schemaPayload?.success !== true) {
              const messages = (schemaPayload?.errors ?? []).map((x) => String(x.message ?? "API error")).join("; ");
              throw new Error(`Production D1 schema SELECT failed (HTTP ${schemaResponse.status}): ${messages || "invalid response"}`);
            }
            const schemaRows = schemaPayload?.result?.[0]?.results ?? [];
            const schemaSummary = schemaRows.map((row) => ({
              table: String(row.name ?? ""),
              createSql: String(row.sql ?? ""),
            }));
            console.log("PRODUCTION D1 SNAPSHOT/AUTOMATION TABLE SCHEMAS (read-only SELECT):");
            console.log(JSON.stringify({
              schemaRows: schemaSummary.length,
              queryMeta: schemaPayload?.result?.[0]?.meta ?? null,
              tables: schemaSummary,
            }, null, 2));

            const d1AuditStart = "2026-11-23T18:10:00Z";
            const d1AuditEnd = "2026-11-23T18:15:00Z";
            const d1DatabaseId = "bbbe128a-c5cc-46ec-b8ef-93860183e795";
            const d1Statements = [
              {
                label: "automation_runs_in_spike_window",
                sql: `SELECT trigger_name, status, started_at, finished_at, companies_checked, companies_failed, alerts_created, error_summary FROM automation_runs WHERE started_at >= '${d1AuditStart}' AND started_at < '${d1AuditEnd}' ORDER BY started_at`,
              },
              {
                label: "global_company_rank_snapshots_captured_in_spike_window",
                sql: `SELECT reporting_day, source, COUNT(*) AS row_count, MIN(captured_at) AS first_captured_at, MAX(captured_at) AS last_captured_at, COUNT(DISTINCT company_id) AS distinct_companies FROM global_company_rank_snapshots WHERE captured_at >= '${d1AuditStart}' AND captured_at < '${d1AuditEnd}' GROUP BY reporting_day, source ORDER BY reporting_day, source`,
              },
              {
                label: "global_company_rank_snapshots_by_source_timestamp_in_spike_window",
                sql: `SELECT source_fetched_at, reporting_day, source, COUNT(*) AS row_count FROM global_company_rank_snapshots WHERE source_fetched_at >= '${d1AuditStart}' AND source_fetched_at < '${d1AuditEnd}' GROUP BY source_fetched_at, reporting_day, source`,
              },
              {
                label: "global_company_rank_snapshot_meta",
                sql: "SELECT singleton_id, reporting_day, source_fetched_at, company_count, updated_at FROM global_company_rank_snapshot_meta WHERE singleton_id = 1",
              },
              {
                label: "global_rankings_cache_timestamp",
                sql: "SELECT cache_id, fetched_at, length(companies_json) AS companies_json_bytes FROM global_rankings_cache WHERE cache_id = 1",
              },
              {
                label: "global_rankings_refresh_run_detail",
                sql: `SELECT run_id, source, status, started_at, updated_at, finished_at, companies_seen, snapshot_fetched_at, type_index, page_offset FROM global_rankings_refresh_runs WHERE run_id = '6b825378083084fcb8e69111'`,
              },
              { label: "company_api_keys_total", sql: "SELECT COUNT(*) AS row_count FROM company_api_keys" },
              { label: "legacy_company_keys_total", sql: "SELECT COUNT(*) AS row_count FROM company_keys" },
              { label: "companies_fetched_in_spike_window", sql: `SELECT COUNT(*) AS row_count FROM companies WHERE fetched_at >= '${d1AuditStart}' AND fetched_at < '${d1AuditEnd}'` },
              { label: "company_snapshots_inserted_in_spike_window", sql: `SELECT COUNT(*) AS row_count FROM company_snapshots WHERE fetched_at >= '${d1AuditStart}' AND fetched_at < '${d1AuditEnd}'` },
              { label: "company_financials_updated_in_spike_window", sql: `SELECT COUNT(*) AS row_count FROM company_financials WHERE fetched_at >= '${d1AuditStart}' AND fetched_at < '${d1AuditEnd}'` },
              { label: "company_financial_snapshots_inserted_in_spike_window", sql: `SELECT COUNT(*) AS row_count FROM company_financial_snapshots WHERE fetched_at >= '${d1AuditStart}' AND fetched_at < '${d1AuditEnd}'` },
              { label: "faction_member_cache_updated_in_spike_window", sql: `SELECT COUNT(*) AS row_count FROM faction_member_cache WHERE updated_at >= '${d1AuditStart}' AND updated_at < '${d1AuditEnd}'` },
              { label: "faction_director_snapshots_inserted_in_spike_window", sql: `SELECT COUNT(*) AS row_count FROM faction_director_snapshots WHERE fetched_at >= '${d1AuditStart}' AND fetched_at < '${d1AuditEnd}'` },
              { label: "faction_company_rank_snapshots_inserted_in_spike_window", sql: `SELECT COUNT(*) AS row_count FROM faction_company_rank_snapshots WHERE captured_at >= '${d1AuditStart}' AND captured_at < '${d1AuditEnd}'` },
              { label: "faction_roster_snapshots_inserted_in_spike_window", sql: `SELECT COUNT(*) AS row_count FROM faction_roster_snapshots WHERE captured_at >= '${d1AuditStart}' AND captured_at < '${d1AuditEnd}'` },
              { label: "faction_member_roster_snapshots_inserted_in_spike_window", sql: `SELECT COUNT(*) AS row_count FROM faction_member_roster_snapshots WHERE captured_at >= '${d1AuditStart}' AND captured_at < '${d1AuditEnd}'` },
              { label: "faction_member_stat_snapshots_inserted_in_spike_window", sql: `SELECT COUNT(*) AS row_count FROM faction_member_stat_snapshots WHERE captured_at >= '${d1AuditStart}' AND captured_at < '${d1AuditEnd}'` },
              { label: "faction_gym_energy_snapshots_inserted_in_spike_window", sql: `SELECT COUNT(*) AS row_count FROM faction_gym_energy_snapshots WHERE captured_at >= '${d1AuditStart}' AND captured_at < '${d1AuditEnd}'` },
              {
                label: "faction_performance_collection_runs_in_spike_window",
                sql: `SELECT collection_kind, status, scheduled_at, started_at, completed_at, created_at, updated_at, next_index FROM faction_performance_collection_runs WHERE (created_at >= '${d1AuditStart}' AND created_at < '${d1AuditEnd}') OR (started_at >= '${d1AuditStart}' AND started_at < '${d1AuditEnd}') OR (completed_at >= '${d1AuditStart}' AND completed_at < '${d1AuditEnd}') ORDER BY created_at`,
              },
              { label: "faction_performance_collection_state_updated_in_spike_window", sql: `SELECT COUNT(*) AS row_count FROM faction_performance_collection_state WHERE updated_at >= '${d1AuditStart}' AND updated_at < '${d1AuditEnd}'` },
              {
                label: "global_rankings_refresh_runs_in_spike_window",
                sql: `SELECT run_id, source, status, started_at, updated_at, finished_at, companies_seen, expected_total FROM global_rankings_refresh_runs WHERE (started_at >= '${d1AuditStart}' AND started_at < '${d1AuditEnd}') OR (updated_at >= '${d1AuditStart}' AND updated_at < '${d1AuditEnd}') ORDER BY started_at`,
              },
              {
                label: "global_rankings_pages_joined_to_runs_started_in_spike_window",
                sql: `SELECT COUNT(*) AS row_count FROM global_rankings_refresh_pages p JOIN global_rankings_refresh_runs r ON r.run_id = p.run_id WHERE r.started_at >= '${d1AuditStart}' AND r.started_at < '${d1AuditEnd}'`,
              },
              { label: "faction_membership_intervals_last_seen_in_spike_window", sql: `SELECT COUNT(*) AS row_count FROM faction_membership_intervals WHERE last_seen_at >= '${d1AuditStart}' AND last_seen_at < '${d1AuditEnd}'` },
            ];
            const d1AuditResults = [];
            for (const item of d1Statements) {
              const response = await fetch(
                `https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/d1/database/${d1DatabaseId}/query`,
                {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${token}`,
                    "Content-Type": "application/json",
                    Accept: "application/json",
                  },
                  body: JSON.stringify({ sql: item.sql }),
                  signal: AbortSignal.timeout(20000),
                }
              );
              const payload = await response.json().catch(() => null);
              if (!response.ok || payload?.success !== true) {
                const messages = (payload?.errors ?? []).map((x) => String(x.message ?? "API error")).join("; ");
                throw new Error(`Production D1 SELECT ${item.label} failed (HTTP ${response.status}): ${messages || "invalid response"}`);
              }
              d1AuditResults.push({
                label: item.label,
                meta: payload?.result?.[0]?.meta ?? null,
                rows: payload?.result?.[0]?.results ?? [],
              });
            }
            console.log("PRODUCTION D1 TABLE COUNTS FOR 18:10–18:15 UTC (SELECT-ONLY):");
            console.log(JSON.stringify({
              timeWindowUtc: { startInclusive: d1AuditStart, endExclusive: d1AuditEnd },
              queryCount: d1AuditResults.length,
              d1Results: d1AuditResults,
              totalRowsWrittenByAuditQueries: d1AuditResults.reduce((sum, x) => sum + Number(x.meta?.rows_written ?? 0), 0),
            }, null, 2));

            const dashboardDatabaseId = "bbbe128a-c5cc-46ec-b8ef-93860183e795";
            const d1QueryPath = `/accounts/${ACCOUNT_ID}/d1/database/${dashboardDatabaseId}/query`;
            const [snapshotCountResult, scheduledRunResult] = await Promise.all([
              cloudflarePost(d1QueryPath, {
                sql: "SELECT reporting_day, COUNT(*) AS row_count, COUNT(DISTINCT company_id) AS distinct_companies, MIN(source_fetched_at) AS first_source_fetched_at, MAX(source_fetched_at) AS last_source_fetched_at, MIN(captured_at) AS first_captured_at, MAX(captured_at) AS last_captured_at FROM global_company_rank_snapshots WHERE reporting_day = '2026-11-23' GROUP BY reporting_day"
              }, "Read-only global company snapshot count"),
              cloudflarePost(d1QueryPath, {
                sql: "SELECT run_id, source, status, companies_seen, snapshot_fetched_at, started_at, finished_at FROM global_rankings_refresh_runs WHERE source = 'scheduled' AND snapshot_fetched_at >= '2026-11-23T00:00:00Z' AND snapshot_fetched_at < '2026-11-24T00:00:00Z' ORDER BY started_at"
              }, "Read-only scheduled global ranking run lookup"),
            ]);
            const normalizeD1QueryResults = (value) => {
              const resultSets = Array.isArray(value) ? value : [];
              return resultSets.map((resultSet) => ({
                success: resultSet?.success ?? null,
                meta: resultSet?.meta ?? null,
                results: Array.isArray(resultSet?.results) ? resultSet.results : [],
              }));
            };
            const snapshotCountSets = normalizeD1QueryResults(snapshotCountResult);
            const scheduledRunSets = normalizeD1QueryResults(scheduledRunResult);
            console.log("PRODUCTION D1 GLOBAL RANKING SNAPSHOT RECONCILIATION (SELECT only):");
            console.log(JSON.stringify({
              database: "naughty-company-dashboard",
              timeWindowUtc: { startInclusive: "2026-11-23T00:00:00Z", endExclusive: "2026-11-24T00:00:00Z" },
              snapshotCountResults: snapshotCountSets,
              scheduledRankingRunResults: scheduledRunSets,
            }, null, 2));

            const auditStart = "2026-11-23T18:00:00Z";
            const auditEnd = "2026-11-23T19:00:00Z";
            const auditUrl = new URL(`https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/logs/audit`);
            auditUrl.searchParams.set("since", auditStart);
            auditUrl.searchParams.set("before", auditEnd);
            auditUrl.searchParams.set("direction", "asc");
            auditUrl.searchParams.set("limit", "1000");
            const auditResponse = await fetch(auditUrl, {
              method: "GET",
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: "application/json",
              },
              signal: AbortSignal.timeout(20000),
            });
            const auditPayload = await auditResponse.json().catch(() => null);
            if (!auditResponse.ok || auditPayload?.success !== true) {
              const messages = (auditPayload?.errors ?? []).map((x) => String(x.message ?? "API error")).join("; ");
              throw new Error(`Account audit log query failed (HTTP ${auditResponse.status}): ${messages || "invalid response"}`);
            }
            const auditRows = Array.isArray(auditPayload?.result) ? auditPayload.result : [];
            const sanitizedAuditRows = auditRows.map((row) => ({
              time: row?.action?.time ?? null,
              actionType: row?.action?.type ?? null,
              actionDescription: row?.action?.description ?? null,
              actionResult: row?.action?.result ?? null,
              actorContext: row?.actor?.context ?? null,
              actorType: row?.actor?.type ?? null,
              actorTokenName: row?.actor?.token_name ?? null,
              actorTokenId: row?.actor?.token_id ?? null,
              actorEmail: row?.actor?.email ?? null,
              rawMethod: row?.raw?.method ?? null,
              rawStatusCode: row?.raw?.status_code ?? null,
              rawUri: row?.raw?.uri ?? null,
              resourceProduct: row?.resource?.product ?? null,
              resourceType: row?.resource?.type ?? null,
              resourceId: row?.resource?.id ?? null,
              resourceScope: row?.resource?.scope ?? null,
            }));
            const d1AuditRows = sanitizedAuditRows.filter((row) =>
              /d1|database|sql/i.test([
                row.actionDescription,
                row.rawUri,
                row.resourceProduct,
                row.resourceType,
              ].filter(Boolean).join(" "))
            );
            console.log("ACCOUNT AUDIT LOGS FOR 18:00–19:00 UTC (sanitized):");
            console.log(JSON.stringify({
              timeWindowUtc: { startInclusive: auditStart, endExclusive: auditEnd },
              totalAccountAuditRows: auditRows.length,
              resultInfo: auditPayload?.result_info ?? null,
              d1RelatedRows: d1AuditRows.length,
              d1RelatedAuditRows: d1AuditRows,
              otherAccountAuditRows: sanitizedAuditRows.length - d1AuditRows.length,
            }, null, 2));

            const liveContentResponse = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/naughtyfamily-api/content/v2`,
              {
                method: "GET",
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/json",
                },
                signal: AbortSignal.timeout(20000),
              }
            );
            const liveContent = await liveContentResponse.text();
            let contentPayload = null;
            try { contentPayload = JSON.parse(liveContent); } catch { /* content may be multipart */ }
            const contentText = contentPayload
              ? JSON.stringify(contentPayload)
              : liveContent;
            const liveBundleSummary = {
              status: liveContentResponse.status,
              contentLength: liveContent.length,
              hasD1RequestReadMeter: contentText.includes("D1RequestReadMeter"),
              hasD1ReadAccountingMarker: contentText.includes("d1_read_accounting"),
              hasRunScheduledAutomation: contentText.includes("runScheduledAutomation"),
              hasDailyCronString: contentText.includes("10 18 * * *"),
              hasFactionDirectorySync: contentText.includes("syncFactionDirectorDirectory"),
              hasRankingProfileRefresh: contentText.includes("refreshRankingProfiles"),
              hasGlobalRankingRefresh: contentText.includes("refreshGlobalRankingCache"),
            };
            if (!liveContentResponse.ok) throw new Error(`Live Worker content fetch failed (HTTP ${liveContentResponse.status}).`);

            const schedules = await cloudflareGet(
              `/accounts/${ACCOUNT_ID}/workers/scripts/naughtyfamily-api/schedules`,
              "naughtyfamily-api cron schedules"
            );
            console.log("LIVE PRODUCTION WORKER BUNDLE FEATURE CHECK (no source dump):");
            console.log(JSON.stringify(liveBundleSummary, null, 2));
            console.log("LIVE PRODUCTION WORKER CRON SCHEDULES:");
            console.log(JSON.stringify(schedules, null, 2));

            const versionHistoryResult = await cloudflareGet(
              `/accounts/${ACCOUNT_ID}/workers/scripts/naughtyfamily-api/versions?per_page=100`,
              "naughtyfamily-api version history"
            );
            const versionItems = Array.isArray(versionHistoryResult?.items) ? versionHistoryResult.items : [];
            const workerVersionHistory = versionItems.map((item) => ({
              id: item?.id ?? null,
              number: item?.number ?? null,
              createdOn: item?.metadata?.created_on ?? null,
              modifiedOn: item?.metadata?.modified_on ?? null,
              source: item?.metadata?.source ?? null,
              hasPreview: item?.metadata?.hasPreview ?? null,
            }));
            console.log("NAUGHTYFAMILY API VERSION HISTORY (read-only metadata):");
            console.log(JSON.stringify(workerVersionHistory, null, 2));

            const scriptList = await cloudflareGet(`/accounts/${ACCOUNT_ID}/workers/scripts?per_page=100`, "Worker script inventory");
            const scripts = Array.isArray(scriptList) ? scriptList : [];
            const workerInventory = [];
            for (const script of scripts) {
              const scriptName = String(script?.id ?? script?.name ?? "");
              if (!scriptName) continue;
              try {
                const settingsPayload = await cloudflareGet(
                  `/accounts/${ACCOUNT_ID}/workers/scripts/${encodeURIComponent(scriptName)}/settings`,
                  `Worker settings for ${scriptName}`
                );
                const bindings = Array.isArray(settingsPayload?.bindings) ? settingsPayload.bindings : [];
                workerInventory.push({
                  scriptName,
                  d1Bindings: bindings
                    .filter((binding) => binding?.type === "d1")
                    .map((binding) => ({
                      bindingName: String(binding.name ?? ""),
                      databaseId: String(binding.database_id ?? ""),
                      databaseName: String(binding.database_name ?? ""),
                    })),
                  queueBindings: bindings
                    .filter((binding) => binding?.type === "queue")
                    .map((binding) => ({
                      bindingName: String(binding.name ?? ""),
                      queueName: String(binding.queue_name ?? ""),
                    })),
                  settingsReadable: true,
                });
              } catch {
                workerInventory.push({ scriptName, d1Bindings: [], queueBindings: [], settingsReadable: false });
              }
            }
            console.log("DEPLOYED WORKER D1 BINDING INVENTORY (no secret values):");
            console.log(JSON.stringify(workerInventory, null, 2));

            const keysResult = await post("/keys", {}, "Observability key discovery");
            const keys = Array.isArray(keysResult?.keys) ? keysResult.keys : Array.isArray(keysResult) ? keysResult : [];
            const discovered = keys.map((k) => String(k?.key ?? ""));

            const valueSpecs = [
              { key: "$workers.scriptName", type: "string" },
              { key: "$metadata.message", type: "string" },
              { key: "$metadata.messageTemplate", type: "string" },
            ];
            const discoveredValues = {};
            for (const spec of valueSpecs) {
              if (!discovered.includes(spec.key)) continue;
              const result = await post("/values", {
                datasets: [],
                key: spec.key,
                timeframe,
                type: spec.type,
              }, `Value discovery for ${spec.key}`);
              const values = getValues(result);
              discoveredValues[spec.key] = values.map((item) => ({
                value: spec.key === "$workers.scriptName" ? valueText(item) : undefined,
                containsD1Accounting: valueText(item).includes("d1_read_accounting"),
                count: num(item?.count ?? item?.frequency),
              }));
            }

            const scriptNames = (discoveredValues["$workers.scriptName"] ?? [])
              .map((x) => x.value)
              .filter((x) => x && x.length < 200);

            console.log("OBSERVABILITY DISCOVERY:");
            console.log(JSON.stringify({
              relevantKeys: valueSpecs.map((x) => x.key).filter((x) => discovered.includes(x)),
              scriptNameValues: scriptNames,
              messageValueCount: discoveredValues["$metadata.message"]?.length ?? 0,
              messageValuesContainingD1Accounting: (discoveredValues["$metadata.message"] ?? []).filter((x) => x.containsD1Accounting).length,
              messageTemplateValuesContainingD1Accounting: (discoveredValues["$metadata.messageTemplate"] ?? []).filter((x) => x.containsD1Accounting).length,
            }, null, 2));

            const runSummaries = [];
            const accountingRows = [];
            for (const scriptName of scriptNames) {
              const query = {
                queryId: "ncd-d1-accounting-audit-2026-11-23",
                timeframe,
                dry: true,
                view: "events",
                limit: 2000,
                parameters: {
                  filterCombination: "and",
                  filters: [{
                    key: "$workers.scriptName",
                    operation: "eq",
                    type: "string",
                    value: scriptName,
                  }],
                },
              };
              const result = await post("/query", query, `Telemetry event query for ${scriptName}`);
              const eventBlock = result?.events ?? {};
              const events = Array.isArray(eventBlock.events) ? eventBlock.events : [];
              let parsedCount = 0;
              for (const event of events) {
                const parsed = [
                  ...parseLog(event?.source),
                  ...parseLog(event?.["$metadata"]?.message),
                  ...parseLog(event?.message),
                  ...parseLog(event?.event),
                ];
                for (const accounting of parsed) {
                  parsedCount += 1;
                  accountingRows.push({
                    eventId: event?.["$metadata"]?.id ?? null,
                    timestamp: accounting.observedAt ?? event?.timestamp ?? null,
                    scriptName,
                    eventType: accounting.eventType ?? event?.$workers?.eventType ?? "unknown",
                    cron: accounting.cron ?? null,
                    queue: accounting.queue ?? null,
                    route: accounting.route ?? null,
                    method: accounting.method ?? null,
                    rowsWritten: num(accounting.rowsWritten),
                    rowsRead: num(accounting.rowsRead),
                    statementCount: num(accounting.statementCount),
                    methodCounts: accounting.methodCounts ?? null,
                    accountingStatus: accounting.accountingStatus ?? "unknown",
                    missingWriteMetrics: num(accounting.missingWriteMetrics),
                    failedStatements: num(accounting.failedStatements),
                    unsupportedOperations: num(accounting.unsupportedOperations),
                    backgroundTasks: num(accounting.backgroundTasks),
                    backgroundTaskFailures: num(accounting.backgroundTaskFailures),
                    durationMs: num(accounting.durationMs),
                  });
                }
              }
              runSummaries.push({
                scriptName,
                matchingEvents: eventBlock.count ?? null,
                returnedEvents: events.length,
                parsedD1AccountingLogs: parsedCount,
                queryRunId: result?.run?.id ?? null,
                queryDry: result?.run?.dry ?? null,
                sampleEventFields: events.slice(0, 2).map((event) => ({
                  dataset: event?.dataset ?? null,
                  sourceType: typeof event?.source,
                  sourceKeys: event?.source && typeof event.source === "object" && !Array.isArray(event.source) ? Object.keys(event.source).slice(0, 20) : [],
                  metadataMessageTemplate: event?.["$metadata"]?.messageTemplate ?? null,
                  metadataMessageContainsD1Accounting: String(event?.["$metadata"]?.message ?? "").includes("d1_read_accounting"),
                })),
              });
            }

            const byTrigger = {};
            for (const row of accountingRows) {
              const key = row.eventType === "scheduled" ? `scheduled:${row.cron ?? "unknown"}`
                : row.eventType === "queue" ? `queue:${row.queue ?? "unknown"}`
                : row.eventType === "fetch" ? `fetch:${row.route ?? "unknown"}`
                : row.eventType;
              byTrigger[key] ??= {
                eventType: row.eventType,
                cron: row.cron,
                queue: row.queue,
                route: row.route,
                invocations: 0,
                rowsWritten: 0,
                rowsRead: 0,
                statements: 0,
                missingWriteMetrics: 0,
                incompleteAccountingInvocations: 0,
                backgroundTasks: 0,
                backgroundTaskFailures: 0,
              };
              const target = byTrigger[key];
              target.invocations += 1;
              target.rowsWritten += row.rowsWritten;
              target.rowsRead += row.rowsRead;
              target.statements += row.statementCount;
              target.missingWriteMetrics += row.missingWriteMetrics;
              target.backgroundTasks += row.backgroundTasks;
              target.backgroundTaskFailures += row.backgroundTaskFailures;
              if (row.accountingStatus !== "complete") target.incompleteAccountingInvocations += 1;
            }

            const report = {
              timeWindowUtc: { startInclusive: START, endExclusive: END },
              method: "Cloudflare Workers Observability telemetry API; all queries use dry=true",
              invocationLogCount: accountingRows.length,
              totalRowsWritten: accountingRows.reduce((sum, x) => sum + x.rowsWritten, 0),
              totalRowsRead: accountingRows.reduce((sum, x) => sum + x.rowsRead, 0),
              totalStatements: accountingRows.reduce((sum, x) => sum + x.statementCount, 0),
              missingWriteMetrics: accountingRows.reduce((sum, x) => sum + x.missingWriteMetrics, 0),
              failedStatements: accountingRows.reduce((sum, x) => sum + x.failedStatements, 0),
              unsupportedOperations: accountingRows.reduce((sum, x) => sum + x.unsupportedOperations, 0),
              incompleteAccountingInvocations: accountingRows.filter((x) => x.accountingStatus !== "complete").length,
              byScriptName: runSummaries,
              byTrigger: Object.values(byTrigger).sort((a, b) => b.rowsWritten - a.rowsWritten),
              invocationEvents: accountingRows.sort((a, b) => String(a.timestamp).localeCompare(String(b.timestamp))),
            };
            console.log("D1 INVOCATION WRITE ACCOUNTING (sanitized):");
            console.log(JSON.stringify(report, null, 2));
            if (accountingRows.length === 0) {
              console.error("No D1 accounting events were returned. Inspect the scriptName, message, and dataset value discovery above.");
              process.exitCode = 1;
            }
          } catch (error) {
            console.error(`Observability accounting audit failed: ${error instanceof Error ? error.message : "unknown error"}`);
            process.exitCode = 1;
          }
          NODE
