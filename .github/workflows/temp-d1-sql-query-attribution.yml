name: Temporary D1 SQL API Previous UTC Day Attribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribute-writes:
    name: Query sampled D1 query-event dataset for Nov 23 18:10-18:15 UTC
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run read-only D1 SQL Analytics query
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const ACCOUNT_ID = "6c03b978ed9a59adc3f61c715bdad45c";
          const START = "2026-11-23T18:10:00Z";
          const END_EXCLUSIVE = "2026-11-23T18:15:00Z";
          const DATABASES = {
            "bbbe128a-c5cc-46ec-b8ef-93860183e795": "naughty-company-dashboard",
            "46f7536d-f69c-4304-8b44-615901c60b7c": "naughty-company-bot-production",
            "02cca699-1232-495f-8a0a-de525058b92a": "naughtyfamily-acceptance-staging",
          };

          if (!token) {
            console.error("CLOUDFLARE_API_TOKEN Actions secret is missing or unavailable.");
            process.exit(1);
          }

          const query = `
            SELECT
              databaseId,
              query AS statement,
              error,
              COUNT(*) AS numberOfTimesRun,
              SUM(rowsWritten) AS totalRowsWritten,
              AVG(rowsWritten) AS avgRowsWritten,
              SUM(rowsRead) AS totalRowsRead,
              AVG(queryDurationMs) AS avgDurationMs,
              SUM(queryDurationMs) AS totalDurationMs
            FROM events.d1Queries
            WHERE timestamp >= $start
              AND timestamp < $end
              AND rowsWritten > 0
            GROUP BY databaseId, query, error
            ORDER BY totalRowsWritten DESC
            LIMIT 5000
          `;

          const response = await fetch("https://api.cloudflare.com/client/v4/analytics/sql", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify({
              query,
              params: { start: START, end: END_EXCLUSIVE },
              scope: { accountTag: ACCOUNT_ID },
            }),
            signal: AbortSignal.timeout(30000),
          });

          const payload = await response.json().catch(() => null);
          if (!response.ok || !payload || !Array.isArray(payload.data)) {
            const message = Array.isArray(payload?.errors)
              ? payload.errors.map((item) => item.message).join("; ")
              : "invalid response";
            console.error(`Cloudflare SQL API rejected the read-only query (HTTP ${response.status}): ${message}`);
            process.exit(1);
          }

          function num(value) { return Number(value ?? 0); }
          function databaseName(id) { return DATABASES[id] ?? `unmapped database ${id || "(missing id)"}`; }
          function redactSql(sql) {
            return String(sql ?? "")
              .replace(/'(?:''|[^'])*'/g, "'[literal]'")
              .replace(/\s+/g, " ")
              .trim();
          }

          const rows = payload.data.map((row) => ({
            databaseId: String(row.databaseId ?? ""),
            database: databaseName(String(row.databaseId ?? "")),
            statement: redactSql(row.statement),
            error: String(row.error ?? ""),
            numberOfTimesRun: num(row.numberOfTimesRun),
            rowsWritten: num(row.totalRowsWritten),
            avgRowsWritten: num(row.avgRowsWritten),
            rowsRead: num(row.totalRowsRead),
            avgDurationMs: num(row.avgDurationMs),
            totalDurationMs: num(row.totalDurationMs),
          }));

          const byDatabase = {};
          for (const row of rows) {
            byDatabase[row.databaseId] ??= {
              databaseId: row.databaseId,
              database: row.database,
              rowsWritten: 0,
              executions: 0,
              queryGroups: 0,
            };
            byDatabase[row.databaseId].rowsWritten += row.rowsWritten;
            byDatabase[row.databaseId].executions += row.numberOfTimesRun;
            byDatabase[row.databaseId].queryGroups += 1;
          }

          const totalRowsWritten = rows.reduce((sum, row) => sum + row.rowsWritten, 0);
          const totalRuns = rows.reduce((sum, row) => sum + row.numberOfTimesRun, 0);
          const unsuccessfulGroups = rows.filter((row) => row.error !== "");
          const report = {
            timeWindowUtc: { startInclusive: START, endExclusive: END_EXCLUSIVE },
            source: "Cloudflare Analytics SQL API, events.d1Queries",
            sampling: "Cloudflare documents this dataset as sampled and automatically applies sample weights to COUNT, SUM and AVG. Do not multiply these results by sampleInterval.",
            resultRows: rows.length,
            returnedRowsWritten: totalRowsWritten,
            weightedQueryExecutions: totalRuns,
            databaseTotals: Object.values(byDatabase).sort((a, b) => b.rowsWritten - a.rowsWritten),
            unsuccessfulQueryGroupsWithWrites: unsuccessfulGroups.length,
            topWriteStatements: rows.slice(0, 100),
            responseStatistics: payload.statistics ?? null,
          };

          console.log("D1 SQL API QUERY-LEVEL WRITE ATTRIBUTION (read-only):");
          console.log(JSON.stringify(report, null, 2));
          NODE
