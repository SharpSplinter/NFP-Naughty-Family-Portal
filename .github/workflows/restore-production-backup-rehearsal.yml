name: Restore production backup migration rehearsal (local SQLite)

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact portal release commit whose migrations are to be replayed
        required: true
        type: string
      backup_format:
        description: Select encrypted GPG archive or short-lived signed Cloudflare D1 SQL export
        required: true
        type: choice
        options:
          - gpg
          - d1-sql
      archive_sha256:
        description: SHA-256 of the selected backup source; for d1-sql, this is the raw SQL export digest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-backup-restore-rehearsal
  cancel-in-progress: false

jobs:
  restore-rehearsal:
    if: (github.ref == 'refs/heads/portal-rebuild' || github.ref == 'refs/heads/main') && inputs.candidate_commit == github.sha
    environment:
      name: production-backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_commit }}

      - name: Verify inputs and protected backup secrets
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          GITHUB_SHA: ${{ github.sha }}
          BACKUP_URL: ${{ secrets.PRODUCTION_D1_BACKUP_URL }}
          BACKUP_PASSWORD: ${{ secrets.PRODUCTION_D1_BACKUP_PASSWORD }}
          BACKUP_FORMAT: ${{ inputs.backup_format }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test "$CANDIDATE_COMMIT" = "$GITHUB_SHA"
          [[ "$CANDIDATE_COMMIT" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          [[ "$BACKUP_URL" == https://* ]]
          case "$BACKUP_FORMAT" in
            gpg)
              test -n "$BACKUP_PASSWORD"
              command -v gpg
              ;;
            d1-sql)
              python3 - "$BACKUP_URL" <<'PY'
          import sys
          from urllib.parse import urlparse
          url = urlparse(sys.argv[1])
          if url.scheme != "https" or not url.hostname or not url.hostname.endswith(".r2.cloudflarestorage.com"):
              raise SystemExit("Raw SQL source must use a signed Cloudflare R2 HTTPS URL.")
          if not url.path.startswith("/d1-sqlio-outgoing-prod/") or not url.path.endswith(".sql"):
              raise SystemExit("Raw SQL source must point to the Cloudflare D1 export bucket and a .sql object.")
          if not url.query:
              raise SystemExit("Raw SQL source must retain its temporary signed query string.")
          PY
              ;;
            *)
              echo "::error::Unsupported backup source format."
              exit 1
              ;;
          esac
          echo "Candidate SHA, protected backup source, and source checksum format are valid." >> "$GITHUB_STEP_SUMMARY"

      - name: Download and verify the selected backup source
        env:
          BACKUP_URL: ${{ secrets.PRODUCTION_D1_BACKUP_URL }}
          BACKUP_FORMAT: ${{ inputs.backup_format }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          source_file="$RUNNER_TEMP/production-d1-backup.source"
          download_url="$BACKUP_URL"

          if [[ "$BACKUP_FORMAT" == "gpg" && "$BACKUP_URL" == https://drive.google.com/uc\?* ]]; then
            # Drive's legacy /uc endpoint can return a viewer/interstitial response
            # to non-browser clients. Force its binary download host.
            download_url="https://drive.usercontent.google.com/download?${BACKUP_URL#*\?}"
            [[ "$download_url" == *confirm=* ]] || download_url="${download_url}&confirm=t"
            [[ "$download_url" == *authuser=* ]] || download_url="${download_url}&authuser=0"
          fi

          content_type="$(curl --fail --location --silent --show-error --retry 2 --retry-delay 3 \
            --header 'Accept: application/octet-stream' \
            --output "$source_file" --write-out '%{content_type}' "$download_url")"
          actual="$(sha256sum "$source_file" | awk '{print $1}')"
          actual_bytes="$(stat -c '%s' "$source_file")"
          if [[ "$actual" != "$ARCHIVE_SHA256" ]]; then
            echo "::error::Backup source checksum mismatch (expected $ARCHIVE_SHA256, received $actual, bytes $actual_bytes, content type $content_type)."
            exit 1
          fi
          echo "Selected backup source downloaded into ephemeral runner storage and SHA-256 verified."

      - name: Prepare normalized SQL export in ephemeral runner storage
        env:
          BACKUP_PASSWORD: ${{ secrets.PRODUCTION_D1_BACKUP_PASSWORD }}
          BACKUP_FORMAT: ${{ inputs.backup_format }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          source_file="$RUNNER_TEMP/production-d1-backup.source"
          restore_dir="$RUNNER_TEMP/production-d1-restore"
          mkdir -p "$restore_dir"
          if [[ "$BACKUP_FORMAT" == "d1-sql" ]]; then
            cp "$source_file" "$restore_dir/production-export.sql"
            echo "Signed Cloudflare D1 SQL export copied to ephemeral runner storage."
          else
            decrypted="$RUNNER_TEMP/production-d1-backup.tar.gz"
            printf '%s\n' "$BACKUP_PASSWORD" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt --output "$decrypted" "$source_file"
            tar -xzf "$decrypted" -C "$restore_dir"
            echo "Encrypted GPG archive decrypted successfully in ephemeral runner storage."
          fi
          test -s "$restore_dir/production-export.sql"

      - name: Calculate SQL export digest from the verified archive
        shell: bash
        run: |
          set -euo pipefail
          sql_file="$RUNNER_TEMP/production-d1-restore/production-export.sql"
          actual="$(sha256sum "$sql_file" | awk '{print $1}')"
          [[ "$actual" =~ ^[a-fA-F0-9]{64}$ ]]
          echo "SQL_EXPORT_SHA256=$actual" >> "$GITHUB_ENV"
          echo "Normalized SQL export digest calculated from the archive whose encrypted SHA-256 was verified before decryption." >> "$GITHUB_STEP_SUMMARY"

      - name: Replay migrations 0013-0040 and verify restored data locally
        env:
          SQL_FILE: ${{ runner.temp }}/production-d1-restore/production-export.sql
        run: |
          python3 scripts/replay-production-backup-migrations.py \
            --sql-file "$SQL_FILE" \
            --migrations-dir migrations/auth \
            --expected-sql-sha256 "$SQL_EXPORT_SHA256" \
            --report "$RUNNER_TEMP/production-restore-rehearsal-report.json"

      - name: Publish sanitized rehearsal report only
        uses: actions/upload-artifact@v4
        with:
          name: production-restore-migration-rehearsal
          path: ${{ runner.temp }}/production-restore-rehearsal-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Add sanitized verification summary
        run: |
          echo "## Local production-data migration rehearsal" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.backup_format }}" == "d1-sql" ]]; then
            echo "- Short-lived signed Cloudflare D1 SQL export SHA-256 verified before replay." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Encrypted GPG archive SHA-256 verified against the operator-supplied Drive sidecar value before extraction." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Normalized SQL export SHA-256 rechecked by the offline replay tool." >> "$GITHUB_STEP_SUMMARY"
          echo "- Migrations 0013 through 0040 replayed in filename order; production already records 0038 and 0039, leaving only additive migration 0040 pending." >> "$GITHUB_STEP_SUMMARY"
          echo "- SQLite integrity check, foreign-key check, final migration ledger, and non-decreasing pre-existing table counts verified." >> "$GITHUB_STEP_SUMMARY"
          echo "- Only the sanitized report is retained as a workflow artifact; backup, SQL, and database remain in ephemeral runner storage." >> "$GITHUB_STEP_SUMMARY"
          echo "- This workflow uses local SQLite only. It makes no Cloudflare, D1, Worker, Torn, or Queue API calls." >> "$GITHUB_STEP_SUMMARY"
