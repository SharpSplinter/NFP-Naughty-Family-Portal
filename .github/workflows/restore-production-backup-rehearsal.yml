name: Restore production backup migration rehearsal (local SQLite)

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact portal-rebuild commit whose migrations are to be replayed
        required: true
        type: string
      archive_sha256:
        description: SHA-256 of the encrypted backup archive
        required: true
        default: "052e5bcf352d17ae988eae15ff051e76c5380259c19dc0c694de5611c2c7fb4b"
        type: string
      normalized_sql_sha256:
        description: SHA-256 of the normalized SQL export inside the archive
        required: true
        default: "1188579647f91ad310ec9069eaedd2e896c591a2f7e3ac5365474fb790a34ab2"
        type: string

permissions:
  contents: read

concurrency:
  group: production-backup-restore-rehearsal
  cancel-in-progress: false

jobs:
  restore-rehearsal:
    if: github.ref == 'refs/heads/portal-rebuild' && inputs.candidate_commit == github.sha
    environment:
      name: production-backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_commit }}

      - name: Verify inputs and protected backup secrets
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          GITHUB_SHA: ${{ github.sha }}
          BACKUP_URL: ${{ secrets.PRODUCTION_D1_BACKUP_URL }}
          BACKUP_PASSWORD: ${{ secrets.PRODUCTION_D1_BACKUP_PASSWORD }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          NORMALIZED_SQL_SHA256: ${{ inputs.normalized_sql_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test "$CANDIDATE_COMMIT" = "$GITHUB_SHA"
          [[ "$CANDIDATE_COMMIT" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          [[ "$NORMALIZED_SQL_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          [[ "$BACKUP_URL" == https://* ]]
          test -n "$BACKUP_PASSWORD"
          echo "Candidate SHA, protected archive URL/password presence, and expected checksums are valid." >> "$GITHUB_STEP_SUMMARY"

      - name: Install 7-Zip archive tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes p7zip-full

      - name: Download and verify the encrypted archive
        env:
          BACKUP_URL: ${{ secrets.PRODUCTION_D1_BACKUP_URL }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          archive="$RUNNER_TEMP/production-d1-backup.archive"
          curl --fail --location --silent --show-error --retry 2 --retry-delay 3 "$BACKUP_URL" --output "$archive"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual" = "$ARCHIVE_SHA256" || { echo "::error::Encrypted archive checksum mismatch."; exit 1; }
          echo "Encrypted archive downloaded and SHA-256 verified. Archive bytes are not uploaded as a workflow artifact."

      - name: Decrypt into ephemeral runner storage and locate normalized SQL by checksum
        id: extract
        env:
          BACKUP_PASSWORD: ${{ secrets.PRODUCTION_D1_BACKUP_PASSWORD }}
          NORMALIZED_SQL_SHA256: ${{ inputs.normalized_sql_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          restore_dir="$RUNNER_TEMP/production-d1-restore"
          mkdir -p "$restore_dir"
          7z x -y -p"$BACKUP_PASSWORD" -o"$restore_dir" "$RUNNER_TEMP/production-d1-backup.archive" -bso0 -bsp0
          selected=""
          while IFS= read -r -d '' file; do
            actual="$(sha256sum "$file" | awk '{print $1}')"
            if [[ "$actual" == "$NORMALIZED_SQL_SHA256" ]]; then
              if [[ -n "$selected" ]]; then
                echo "::error::More than one SQL file matched the expected normalized SQL checksum."
                exit 1
              fi
              selected="$file"
            fi
          done < <(find "$restore_dir" -type f -iname '*.sql' -print0)
          test -n "$selected" || { echo "::error::No extracted SQL file matched the expected normalized SQL checksum."; exit 1; }
          echo "sql_file=$selected" >> "$GITHUB_OUTPUT"

      - name: Replay migrations 0013-0037 and verify restored data locally
        env:
          SQL_FILE: ${{ steps.extract.outputs.sql_file }}
          NORMALIZED_SQL_SHA256: ${{ inputs.normalized_sql_sha256 }}
        run: |
          python3 scripts/replay-production-backup-migrations.py \
            --sql-file "$SQL_FILE" \
            --migrations-dir migrations/auth \
            --expected-sql-sha256 "$NORMALIZED_SQL_SHA256" \
            --report "$RUNNER_TEMP/production-restore-rehearsal-report.json"

      - name: Publish sanitized rehearsal report only
        uses: actions/upload-artifact@v4
        with:
          name: production-restore-migration-rehearsal
          path: ${{ runner.temp }}/production-restore-rehearsal-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Add sanitized verification summary
        run: |
          echo "## Local production-data migration rehearsal" >> "$GITHUB_STEP_SUMMARY"
          echo "- Encrypted archive SHA-256 verified before extraction." >> "$GITHUB_STEP_SUMMARY"
          echo "- Normalized SQL SHA-256 verified before SQLite replay." >> "$GITHUB_STEP_SUMMARY"
          echo "- Migrations 0013 through 0037 replayed in filename order." >> "$GITHUB_STEP_SUMMARY"
          echo "- SQLite integrity check, foreign-key check, final migration ledger, and non-decreasing pre-existing table counts verified." >> "$GITHUB_STEP_SUMMARY"
          echo "- Only the sanitized report is retained as a workflow artifact; backup, SQL, and database remain in ephemeral runner storage." >> "$GITHUB_STEP_SUMMARY"
          echo "- This workflow uses local SQLite only. It makes no Cloudflare, D1, Worker, Torn, or Queue API calls." >> "$GITHUB_STEP_SUMMARY"
